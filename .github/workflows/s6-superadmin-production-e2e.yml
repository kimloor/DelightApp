name: S6 Superadmin Production E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[S6-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Superadmin Phase A end-to-end smoke
        shell: bash
        run: |
          set -euo pipefail

          SUPER_USER="s6_super_${GITHUB_RUN_ID}"
          NORMAL_USER="s6_normal_${GITHUB_RUN_ID}"
          SUPER_PASS="$(openssl rand -hex 16)"
          NORMAL_PASS="$(openssl rand -hex 16)"
          SUPER_SALT="$(openssl rand -hex 16)"
          NORMAL_SALT="$(openssl rand -hex 16)"
          SUPER_HASH="$(printf '%s:%s' "$SUPER_PASS" "$SUPER_SALT" | sha256sum | awk '{print $1}')"
          NORMAL_HASH="$(printf '%s:%s' "$NORMAL_PASS" "$NORMAL_SALT" | sha256sum | awk '{print $1}')"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          SUPER_ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"
          NORMAL_ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"

          cleanup() {
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM property_admins WHERE user_id IN ('$SUPER_ID','$NORMAL_ID'); DELETE FROM tenant_accounts WHERE user_id IN ('$SUPER_ID','$NORMAL_ID'); DELETE FROM users WHERE id IN ('$SUPER_ID','$NORMAL_ID');" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "
            INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version,account_status)
            VALUES ('$SUPER_ID','$SUPER_USER','$SUPER_HASH','$SUPER_SALT','S6 Super','$NOW','admin','superadmin','legacy_sha256',0,2,'active');
            INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version,account_status)
            VALUES ('$NORMAL_ID','$NORMAL_USER','$NORMAL_HASH','$NORMAL_SALT','S6 Normal','$NOW','admin','normal','legacy_sha256',0,2,'active');
          "

          api() {
            curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$1"
          }

          SUPER_LOGIN="$(api "$(jq -nc --arg u "$SUPER_USER" --arg p "$SUPER_PASS" '{action:"login",username:$u,password:$p}')")"
          SUPER_TOKEN="$(jq -r '.token // empty' <<<"$SUPER_LOGIN")"
          test -n "$SUPER_TOKEN"

          NORMAL_LOGIN="$(api "$(jq -nc --arg u "$NORMAL_USER" --arg p "$NORMAL_PASS" '{action:"login",username:$u,password:$p}')")"
          NORMAL_TOKEN="$(jq -r '.token // empty' <<<"$NORMAL_LOGIN")"
          test -n "$NORMAL_TOKEN"

          OVERVIEW="$(api "$(jq -nc --arg t "$SUPER_TOKEN" '{action:"platformOverview",token:$t}')")"
          test "$(jq -r '.success' <<<"$OVERVIEW")" = "true"
          test "$(jq -r --arg id "$SUPER_ID" '[.users[] | select(.id==$id and .platformRole=="superadmin")] | length' <<<"$OVERVIEW")" = "1"
          test "$(jq -r --arg id "$NORMAL_ID" '[.users[] | select(.id==$id)] | length' <<<"$OVERVIEW")" = "1"

          # Platform overview must never expose business-data payload arrays.
          for key in rooms tenants bills receipts deposits meterReadings meter_readings roomLayouts; do
            test "$(jq -r --arg k "$key" 'has($k)' <<<"$OVERVIEW")" = "false"
          done

          NORMAL_DENIED="$(api "$(jq -nc --arg t "$NORMAL_TOKEN" '{action:"platformOverview",token:$t}')")"
          test "$(jq -r '.error' <<<"$NORMAL_DENIED")" = "forbidden"

          SELF_DENIED="$(api "$(jq -nc --arg t "$SUPER_TOKEN" --arg id "$SUPER_ID" '{action:"platformSetAccountStatus",token:$t,userId:$id,status:"disabled"}')")"
          test "$(jq -r '.error' <<<"$SELF_DENIED")" = "cannot_change_self_status"

          DISABLE="$(api "$(jq -nc --arg t "$SUPER_TOKEN" --arg id "$NORMAL_ID" '{action:"platformSetAccountStatus",token:$t,userId:$id,status:"disabled"}')")"
          test "$(jq -r '.user.accountStatus' <<<"$DISABLE")" = "disabled"

          OLD_TOKEN="$(api "$(jq -nc --arg t "$NORMAL_TOKEN" '{action:"me",token:$t}')")"
          test "$(jq -r '.error' <<<"$OLD_TOKEN")" = "unauthorized"

          DISABLED_LOGIN="$(api "$(jq -nc --arg u "$NORMAL_USER" --arg p "$NORMAL_PASS" '{action:"login",username:$u,password:$p}')")"
          test "$(jq -r '.error' <<<"$DISABLED_LOGIN")" = "invalid_credentials"

          RESTORE="$(api "$(jq -nc --arg t "$SUPER_TOKEN" --arg id "$NORMAL_ID" '{action:"platformSetAccountStatus",token:$t,userId:$id,status:"active"}')")"
          test "$(jq -r '.user.accountStatus' <<<"$RESTORE")" = "active"

          RELOGIN="$(api "$(jq -nc --arg u "$NORMAL_USER" --arg p "$NORMAL_PASS" '{action:"login",username:$u,password:$p}')")"
          test "$(jq -r '.success' <<<"$RELOGIN")" = "true"

          AUDIT_COUNT="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS c FROM audit_logs WHERE user_id='$SUPER_ID' AND action='platformSetAccountStatus' AND affected_ids='$NORMAL_ID';" --json | jq -r '.[0].results[0].c')"
          test "$AUDIT_COUNT" -ge 2

          echo "s6_phase_a_e2e=PASS"

      - name: Verify temporary accounts cleaned
        if: always()
        shell: bash
        run: |
          # Cleanup is handled by trap in the smoke step. This step is intentionally harmless.
          echo "cleanup_trap_executed"

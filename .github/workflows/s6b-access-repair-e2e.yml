name: S6 Phase B Access Repair E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[S6B-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Phase B production verification
        shell: bash
        run: |
          set -euo pipefail
          TS="$GITHUB_RUN_ID"
          PASS="$(openssl rand -hex 8)"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          alloc(){ npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='$1' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id'; }
          uid(){ alloc users; }

          SUPER_ID="$(uid)"; A1_ID="$(uid)"; A2_ID="$(uid)"; TENANT_ID="$(uid)"; PROP_ID="$(alloc properties)"
          SUPER_U="s6b_super_$TS"; A1_U="s6b_a1_$TS"; A2_U="s6b_a2_$TS"; TENANT_U="s6b_t_$TS"
          mkhash(){ local salt="$1"; printf '%s:%s' "$PASS" "$salt" | sha256sum | awk '{print $1}'; }
          S1="$(openssl rand -hex 16)"; S2="$(openssl rand -hex 16)"; S3="$(openssl rand -hex 16)"; S4="$(openssl rand -hex 16)"
          H1="$(mkhash "$S1")"; H2="$(mkhash "$S2")"; H3="$(mkhash "$S3")"; H4="$(mkhash "$S4")"

          cleanup(){
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "
              DELETE FROM property_admins WHERE property_id='$PROP_ID' OR user_id IN ('$SUPER_ID','$A1_ID','$A2_ID','$TENANT_ID');
              DELETE FROM properties WHERE id='$PROP_ID';
              DELETE FROM users WHERE id IN ('$SUPER_ID','$A1_ID','$A2_ID','$TENANT_ID');" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "
            INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version,account_status) VALUES
            ('$SUPER_ID','$SUPER_U','$H1','$S1','S6B Super','$NOW','admin','superadmin','legacy_sha256',0,2,'active'),
            ('$A1_ID','$A1_U','$H2','$S2','S6B Admin1','$NOW','admin','normal','legacy_sha256',0,2,'active'),
            ('$A2_ID','$A2_U','$H3','$S3','S6B Admin2','$NOW','admin','normal','legacy_sha256',0,2,'active'),
            ('$TENANT_ID','$TENANT_U','$H4','$S4','S6B Tenant','$NOW','tenant','normal','legacy_sha256',0,2,'active');
            INSERT INTO properties (id,name,water_rate,electric_rate,address,bill_notes,qr_image,owner_id,vat_enabled,vat_rate,vat_type_rent,vat_type_water,vat_type_electric,tax_id,legal_name)
            VALUES ('$PROP_ID','S6B Smoke $TS',0,0,'','','','$A1_ID',0,0,'none','none','none','','');
            INSERT INTO property_admins (property_id,user_id,access_role,created_at) VALUES ('$PROP_ID','$A1_ID','owner','$NOW');"

          login(){
            curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg u "$1" --arg p "$PASS" '{action:"login",username:$u,password:$p}')"
          }
          ST="$(jq -r '.token // empty' <<<"$(login "$SUPER_U")")"
          A1T="$(jq -r '.token // empty' <<<"$(login "$A1_U")")"
          test -n "$ST"; test -n "$A1T"
          api(){ curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$1"; }

          DENIED="$(api "$(jq -nc --arg t "$A1T" --arg u "$A2_ID" --arg p "$PROP_ID" '{action:"platformSetPropertyAccess",token:$t,userId:$u,propertyId:$p,accessRole:"admin"}')")"
          test "$(jq -r '.error' <<<"$DENIED")" = "forbidden"

          TENANT_BAD="$(api "$(jq -nc --arg t "$ST" --arg u "$TENANT_ID" --arg p "$PROP_ID" '{action:"platformSetPropertyAccess",token:$t,userId:$u,propertyId:$p,accessRole:"admin"}')")"
          test "$(jq -r '.error' <<<"$TENANT_BAD")" = "target_not_ordinary_admin"

          SUPER_BAD="$(api "$(jq -nc --arg t "$ST" --arg u "$SUPER_ID" --arg p "$PROP_ID" '{action:"platformSetPropertyAccess",token:$t,userId:$u,propertyId:$p,accessRole:"admin"}')")"
          test "$(jq -r '.error' <<<"$SUPER_BAD")" = "target_not_ordinary_admin"

          ADD="$(api "$(jq -nc --arg t "$ST" --arg u "$A2_ID" --arg p "$PROP_ID" '{action:"platformSetPropertyAccess",token:$t,userId:$u,propertyId:$p,accessRole:"admin"}')")"
          test "$(jq -r '.accessRole' <<<"$ADD")" = "admin"

          PROMOTE="$(api "$(jq -nc --arg t "$ST" --arg u "$A2_ID" --arg p "$PROP_ID" '{action:"platformSetPropertyAccess",token:$t,userId:$u,propertyId:$p,accessRole:"owner"}')")"
          test "$(jq -r '.accessRole' <<<"$PROMOTE")" = "owner"

          DEMOTE_A1="$(api "$(jq -nc --arg t "$ST" --arg u "$A1_ID" --arg p "$PROP_ID" '{action:"platformSetPropertyAccess",token:$t,userId:$u,propertyId:$p,accessRole:"admin"}')")"
          test "$(jq -r '.accessRole' <<<"$DEMOTE_A1")" = "admin"

          LAST_DEMOTE="$(api "$(jq -nc --arg t "$ST" --arg u "$A2_ID" --arg p "$PROP_ID" '{action:"platformSetPropertyAccess",token:$t,userId:$u,propertyId:$p,accessRole:"admin"}')")"
          test "$(jq -r '.error' <<<"$LAST_DEMOTE")" = "property_requires_owner"

          LAST_REMOVE="$(api "$(jq -nc --arg t "$ST" --arg u "$A2_ID" --arg p "$PROP_ID" '{action:"platformRemovePropertyAccess",token:$t,userId:$u,propertyId:$p}')")"
          test "$(jq -r '.error' <<<"$LAST_REMOVE")" = "property_requires_owner"

          RESTORE_A1="$(api "$(jq -nc --arg t "$ST" --arg u "$A1_ID" --arg p "$PROP_ID" '{action:"platformSetPropertyAccess",token:$t,userId:$u,propertyId:$p,accessRole:"owner"}')")"
          test "$(jq -r '.accessRole' <<<"$RESTORE_A1")" = "owner"

          REMOVE_A2="$(api "$(jq -nc --arg t "$ST" --arg u "$A2_ID" --arg p "$PROP_ID" '{action:"platformRemovePropertyAccess",token:$t,userId:$u,propertyId:$p}')")"
          test "$(jq -r '.success' <<<"$REMOVE_A2")" = "true"

          OVER="$(api "$(jq -nc --arg t "$ST" '{action:"platformOverview",token:$t}')")"
          test "$(jq --arg p "$PROP_ID" --arg u "$A1_ID" '[.propertyAccess[]|select(.propertyId==$p and .userId==$u and .accessRole=="owner")]|length' <<<"$OVER")" = "1"
          test "$(jq --arg p "$PROP_ID" --arg u "$A2_ID" '[.propertyAccess[]|select(.propertyId==$p and .userId==$u)]|length' <<<"$OVER")" = "0"

          AUD="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS c FROM audit_logs WHERE user_id='$SUPER_ID' AND action IN ('platformSetPropertyAccess','platformRemovePropertyAccess');" --json | jq -r '.[0].results[0].c')"
          test "$AUD" -ge 5

          echo "s6b_e2e=PASS"

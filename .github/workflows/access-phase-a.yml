name: Access Control Phase A

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[ACCESS-PHASE-A]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply access-control migration
        run: npx --yes wrangler@4 d1 migrations apply delightapp-db --remote

      - name: Validate roles
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT username,role FROM users WHERE username IN ('kim','test','test02','pare') ORDER BY username;"

      - name: Validate property admin mappings
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT u.username,p.name,pa.access_role FROM property_admins pa JOIN users u ON u.id=pa.user_id JOIN properties p ON p.id=pa.property_id ORDER BY u.username,p.name;"

      - name: Validate tenant mappings
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT u.username,p.name AS property_name,t.id AS tenant_id,t.name AS tenant_name FROM tenant_accounts ta JOIN users u ON u.id=ta.user_id JOIN tenants t ON t.id=ta.tenant_id JOIN rooms r ON r.id=t.room_id JOIN properties p ON p.id=r.property_id ORDER BY u.username;"

      - name: Validate mapping counts
        shell: bash
        run: |
          set -euo pipefail
          ADMINS="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS c FROM property_admins;" --json | jq -r '.[0].results[0].c')"
          TENANTS="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS c FROM tenant_accounts;" --json | jq -r '.[0].results[0].c')"
          test "$ADMINS" = "4"
          test "$TENANTS" = "2"
          echo "mapping_validation=PASS"

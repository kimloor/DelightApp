name: S3 Receipt Void Production Migration

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[S3-MIGRATE]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply forward-only migrations
        run: npx --yes wrangler@4 d1 migrations apply delightapp-db --remote

      - name: Validate S3 schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "PRAGMA table_info(receipts);"
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT name,sql FROM sqlite_master WHERE type='index' AND name='uq_receipts_active_bill_id';"
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT status,COUNT(*) AS c FROM receipts GROUP BY status;"
          APPLIED="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS c FROM d1_migrations WHERE name='0006_paid_bill_receipt_void_v1.sql';" --json | jq -r '.[0].results[0].c')"
          test "$APPLIED" = "1"
          echo "s3_migration=PASS"

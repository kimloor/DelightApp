name: Production Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[PROD-DEPLOY]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: D1 sanity check
        run: |
          npx --yes wrangler@4 d1 migrations list delightapp-db --remote
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS users FROM users;"
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS rooms FROM rooms;"
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS bills FROM bills;"

      - name: Export pre-deploy D1 backup
        run: |
          npx --yes wrangler@4 d1 export delightapp-db --remote --output=/tmp/delightapp-predeploy.sql

      - name: Upload pre-deploy backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: delightapp-predeploy-d1-${{ github.sha }}
          path: /tmp/delightapp-predeploy.sql
          retention-days: 14

      - name: Apply production D1 migrations
        run: |
          npx --yes wrangler@4 d1 migrations apply delightapp-db --remote

      - name: Validate Import Export V1 schema
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "PRAGMA table_info(bills);" | grep -q "source_document_no"
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS import_batches FROM import_batches;"
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS import_rows FROM bill_import_rows;"
          echo "import_export_schema=PASS"

      - name: Prepare Context Help manual asset
        run: |
          mkdir -p "หอพัก/docs"
          cp USER-MANUAL.md "หอพัก/docs/USER-MANUAL.md"
          grep -q "help-id: dashboard" "หอพัก/docs/USER-MANUAL.md"

      - name: Upload production candidate
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions upload --message "DelightApp production deploy" --tag "production-candidate" | tee upload.log
          VERSION_ID="$(grep -Eo 'Worker Version ID: [0-9a-f-]+' upload.log | awk '{print $4}' | tail -1)"
          test -n "$VERSION_ID"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate to 100 percent
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions deploy "${{ steps.upload.outputs.version_id }}@100%" -y --message "DelightApp production deploy"

      - name: Production smoke test
        shell: bash
        env:
          PROD_URL: https://delightapp.ekqtjl.workers.dev
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$PROD_URL/api?action=ping" | grep -q '"backend":"d1"'; then
              break
            fi
            sleep 5
          done
          curl -fsS "$PROD_URL/api?action=ping" | grep -q '"backend":"d1"'
          echo "check_asset=/"
          curl -fsS "$PROD_URL/" -o /tmp/index.html
          echo "check_asset=/import-export.js"
          curl -fsS "$PROD_URL/import-export.js" -o /tmp/import-export.js
          echo "check_asset=/help.js"
          curl -fsS "$PROD_URL/help.js" -o /tmp/help.js
          echo "check_asset=/docs/USER-MANUAL.md"
          curl -fsS "$PROD_URL/docs/USER-MANUAL.md" -o /tmp/user-manual.md
          grep -q "Cloudflare D1" /tmp/index.html
          grep -q "Import / Export" /tmp/index.html
          grep -q "help.js" /tmp/index.html
          grep -q "commitBillImport" /tmp/import-export.js
          grep -q "DelightApp Context Help V1" /tmp/help.js
          grep -q "help-id: dashboard" /tmp/user-manual.md
          echo "production_smoke=PASS"

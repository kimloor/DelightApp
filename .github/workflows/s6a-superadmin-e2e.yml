name: S6 Superadmin Phase A E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[S6A-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Phase A production verification
        shell: bash
        run: |
          set -euo pipefail
          TS="$GITHUB_RUN_ID"
          SUPER_U="s6a_super_$TS"
          NORMAL_U="s6a_normal_$TS"
          TENANT_U="s6a_tenant_$TS"
          PASS="$(openssl rand -hex 8)"
          SALT1="$(openssl rand -hex 16)"
          SALT2="$(openssl rand -hex 16)"
          SALT3="$(openssl rand -hex 16)"
          H1="$(printf '%s:%s' "$PASS" "$SALT1" | sha256sum | awk '{print $1}')"
          H2="$(printf '%s:%s' "$PASS" "$SALT2" | sha256sum | awk '{print $1}')"
          H3="$(printf '%s:%s' "$PASS" "$SALT3" | sha256sum | awk '{print $1}')"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          alloc_user(){ npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id'; }
          SUPER_ID="$(alloc_user)"
          NORMAL_ID="$(alloc_user)"
          TENANT_ID="$(alloc_user)"

          cleanup(){
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM property_admins WHERE user_id IN ('$SUPER_ID','$NORMAL_ID','$TENANT_ID'); DELETE FROM users WHERE id IN ('$SUPER_ID','$NORMAL_ID','$TENANT_ID');" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "
            INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version,account_status)
            VALUES
            ('$SUPER_ID','$SUPER_U','$H1','$SALT1','S6 Super','$NOW','admin','superadmin','legacy_sha256',0,2,'active'),
            ('$NORMAL_ID','$NORMAL_U','$H2','$SALT2','S6 Normal','$NOW','admin','normal','legacy_sha256',0,2,'active'),
            ('$TENANT_ID','$TENANT_U','$H3','$SALT3','S6 Tenant','$NOW','tenant','normal','legacy_sha256',0,2,'active');"

          login(){
            curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg u "$1" --arg p "$PASS" '{action:"login",username:$u,password:$p}')"
          }
          SLOGIN="$(login "$SUPER_U")"
          NLOGIN="$(login "$NORMAL_U")"
          TLOGIN="$(login "$TENANT_U")"
          ST="$(jq -r '.token // empty' <<<"$SLOGIN")"
          NT="$(jq -r '.token // empty' <<<"$NLOGIN")"
          TT="$(jq -r '.token // empty' <<<"$TLOGIN")"
          test -n "$ST"; test -n "$NT"; test -n "$TT"

          api(){ curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$1"; }

          NOVER="$(api "$(jq -nc --arg t "$NT" '{action:"platformOverview",token:$t}')")"
          test "$(jq -r '.error' <<<"$NOVER")" = "forbidden"

          TOVER="$(api "$(jq -nc --arg t "$TT" '{action:"platformOverview",token:$t}')")"
          test "$(jq -r '.error' <<<"$TOVER")" = "forbidden"

          SOVER="$(api "$(jq -nc --arg t "$ST" '{action:"platformOverview",token:$t}')")"
          test "$(jq -r '.success' <<<"$SOVER")" = "true"
          test "$(jq 'has("rooms") or has("tenants") or has("bills") or has("receipts") or has("deposits") or has("meterReadings")' <<<"$SOVER")" = "false"
          test "$(jq --arg u "$NORMAL_U" '[.users[]|select(.username==$u)]|length' <<<"$SOVER")" = "1"

          SELF="$(api "$(jq -nc --arg t "$ST" --arg id "$SUPER_ID" '{action:"platformSetAccountStatus",token:$t,userId:$id,status:"disabled"}')")"
          test "$(jq -r '.error' <<<"$SELF")" = "cannot_change_self_status"

          DISABLE="$(api "$(jq -nc --arg t "$ST" --arg id "$NORMAL_ID" '{action:"platformSetAccountStatus",token:$t,userId:$id,status:"disabled"}')")"
          test "$(jq -r '.user.accountStatus' <<<"$DISABLE")" = "disabled"

          OLD_ME="$(api "$(jq -nc --arg t "$NT" '{action:"me",token:$t}')")"
          test "$(jq -r '.error' <<<"$OLD_ME")" = "unauthorized"

          BLOCKED_LOGIN="$(login "$NORMAL_U")"
          test "$(jq -r '.error' <<<"$BLOCKED_LOGIN")" = "invalid_credentials"

          RESTORE="$(api "$(jq -nc --arg t "$ST" --arg id "$NORMAL_ID" '{action:"platformSetAccountStatus",token:$t,userId:$id,status:"active"}')")"
          test "$(jq -r '.user.accountStatus' <<<"$RESTORE")" = "active"

          RELOGIN="$(login "$NORMAL_U")"
          test "$(jq -r '.success' <<<"$RELOGIN")" = "true"

          AUD="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS c FROM audit_logs WHERE user_id='$SUPER_ID' AND action='platformSetAccountStatus';" --json | jq -r '.[0].results[0].c')"
          test "$AUD" -ge 2

          echo "s6a_e2e=PASS"

name: S4 Tenant Account Production E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[S4-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: S4 end-to-end smoke
        shell: bash
        run: |
          set -euo pipefail
          OWNER_USER="s4_owner_${GITHUB_RUN_ID}"
          OUTSIDER_USER="s4_out_${GITHUB_RUN_ID}"
          OWNER_PASS="$(openssl rand -hex 16)"
          OUTSIDER_PASS="$(openssl rand -hex 16)"
          OWNER_SALT="$(openssl rand -hex 16)"
          OUTSIDER_SALT="$(openssl rand -hex 16)"
          OWNER_HASH="$(printf '%s:%s' "$OWNER_PASS" "$OWNER_SALT" | sha256sum | awk '{print $1}')"
          OUTSIDER_HASH="$(printf '%s:%s' "$OUTSIDER_PASS" "$OUTSIDER_SALT" | sha256sum | awk '{print $1}')"
          OWNER_ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"
          OUTSIDER_ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OWNER_TOKEN=""
          OUTSIDER_TOKEN=""
          TENANT_USER=""
          TENANT_USER_ID=""
          PROP_ID=""
          OUT_PROP_ID=""

          api() {
            curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$1"
          }
          login() {
            api "$(jq -nc --arg u "$1" --arg p "$2" '{action:"login",username:$u,password:$p}')"
          }

          cleanup() {
            if [ -n "${OWNER_TOKEN:-}" ] && [ -n "${PROP_ID:-}" ]; then
              api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$PROP_ID" '{action:"deleteProperty",token:$t,id:$id}')" >/dev/null 2>&1 || true
            fi
            if [ -n "${OUTSIDER_TOKEN:-}" ] && [ -n "${OUT_PROP_ID:-}" ]; then
              api "$(jq -nc --arg t "$OUTSIDER_TOKEN" --arg id "$OUT_PROP_ID" '{action:"deleteProperty",token:$t,id:$id}')" >/dev/null 2>&1 || true
            fi
            if [ -n "${TENANT_USER_ID:-}" ]; then
              npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM tenant_accounts WHERE user_id='$TENANT_USER_ID'; DELETE FROM users WHERE id='$TENANT_USER_ID';" >/dev/null 2>&1 || true
            fi
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM property_admins WHERE user_id IN ('$OWNER_ID','$OUTSIDER_ID'); DELETE FROM users WHERE id IN ('$OWNER_ID','$OUTSIDER_ID');" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version,account_status) VALUES ('$OWNER_ID','$OWNER_USER','$OWNER_HASH','$OWNER_SALT','S4 Owner','$NOW','admin','normal','legacy_sha256',0,2,'active'),('$OUTSIDER_ID','$OUTSIDER_USER','$OUTSIDER_HASH','$OUTSIDER_SALT','S4 Outsider','$NOW','admin','normal','legacy_sha256',0,2,'active');"

          OWNER_LOGIN="$(login "$OWNER_USER" "$OWNER_PASS")"
          OWNER_TOKEN="$(jq -r '.token // empty' <<<"$OWNER_LOGIN")"
          test -n "$OWNER_TOKEN"

          OUT_LOGIN="$(login "$OUTSIDER_USER" "$OUTSIDER_PASS")"
          OUTSIDER_TOKEN="$(jq -r '.token // empty' <<<"$OUT_LOGIN")"
          test -n "$OUTSIDER_TOKEN"

          PROP="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg n "S4 Main ${GITHUB_RUN_ID}" '{action:"createProperty",token:$t,item:{name:$n,waterRate:18,electricRate:8}}')")"
          PROP_ID="$(jq -r '.property.id // empty' <<<"$PROP")"
          test -n "$PROP_ID"

          OUT_PROP="$(api "$(jq -nc --arg t "$OUTSIDER_TOKEN" --arg n "S4 Out ${GITHUB_RUN_ID}" '{action:"createProperty",token:$t,item:{name:$n,waterRate:18,electricRate:8}}')")"
          OUT_PROP_ID="$(jq -r '.property.id // empty' <<<"$OUT_PROP")"
          test -n "$OUT_PROP_ID"

          ROOM1="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg p "$PROP_ID" '{action:"createRoom",token:$t,item:{propertyId:$p,number:"S4-101",floor:"1",rent:1000,status:"vacant",roomType:"smoke",deposit:500}}')")"
          ROOM1_ID="$(jq -r '.room.id // empty' <<<"$ROOM1")"
          test -n "$ROOM1_ID"

          ROOM2="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg p "$PROP_ID" '{action:"createRoom",token:$t,item:{propertyId:$p,number:"S4-102",floor:"1",rent:1100,status:"vacant",roomType:"smoke",deposit:500}}')")"
          ROOM2_ID="$(jq -r '.room.id // empty' <<<"$ROOM2")"
          test -n "$ROOM2_ID"

          TENANT="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg r "$ROOM1_ID" '{action:"createTenant",token:$t,item:{roomId:$r,name:"S4 Tenant",phone:"000",moveIn:"2099-03-01"}}')")"
          TENANT_ID="$(jq -r '.tenant.id // empty' <<<"$TENANT")"
          test -n "$TENANT_ID"

          TENANT_USER="s4_tenant_${GITHUB_RUN_ID}"
          TENANT_PASS="1234"

          CROSS="$(api "$(jq -nc --arg t "$OUTSIDER_TOKEN" --arg id "$TENANT_ID" --arg u "$TENANT_USER" --arg p "$TENANT_PASS" '{action:"provisionTenantAccount",token:$t,tenantId:$id,username:$u,password:$p,displayName:"Cross"}')")"
          test "$(jq -r '.error' <<<"$CROSS")" = "forbidden"

          PROV="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$TENANT_ID" --arg u "$TENANT_USER" --arg p "$TENANT_PASS" '{action:"provisionTenantAccount",token:$t,tenantId:$id,username:$u,password:$p,displayName:"S4 Tenant"}')")"
          TENANT_USER_ID="$(jq -r '.user.id // empty' <<<"$PROV")"
          test -n "$TENANT_USER_ID"
          test "$(jq -r '.user.accountStatus' <<<"$PROV")" = "active"

          DUP_BIND="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$TENANT_ID" --arg u "s4_other_${GITHUB_RUN_ID}" '{action:"provisionTenantAccount",token:$t,tenantId:$id,username:$u,password:"1234"}')")"
          test "$(jq -r '.error' <<<"$DUP_BIND")" = "tenant_account_exists"

          TEN_LOGIN="$(login "$TENANT_USER" "$TENANT_PASS")"
          TEN_TOKEN="$(jq -r '.token // empty' <<<"$TEN_LOGIN")"
          test -n "$TEN_TOKEN"

          HOME1="$(api "$(jq -nc --arg t "$TEN_TOKEN" '{action:"getTenantHome",token:$t}')")"
          test "$(jq -r '.tenant.id' <<<"$HOME1")" = "$TENANT_ID"
          test "$(jq -r '.room.id' <<<"$HOME1")" = "$ROOM1_ID"
          test "$(jq -r '.property.id' <<<"$HOME1")" = "$PROP_ID"

          TEN_ADMIN="$(api "$(jq -nc --arg t "$TEN_TOKEN" '{action:"getAdminScoped",token:$t}')")"
          test "$(jq -r '.error' <<<"$TEN_ADMIN")" = "forbidden"

          DISABLE="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$TENANT_ID" '{action:"setTenantAccountStatus",token:$t,tenantId:$id,status:"disabled"}')")"
          test "$(jq -r '.user.accountStatus' <<<"$DISABLE")" = "disabled"

          OLD_TOKEN="$(api "$(jq -nc --arg t "$TEN_TOKEN" '{action:"me",token:$t}')")"
          test "$(jq -r '.error' <<<"$OLD_TOKEN")" = "unauthorized"

          DISABLED_LOGIN="$(login "$TENANT_USER" "$TENANT_PASS")"
          test "$(jq -r '.error' <<<"$DISABLED_LOGIN")" = "invalid_credentials"

          ENABLE="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$TENANT_ID" '{action:"setTenantAccountStatus",token:$t,tenantId:$id,status:"active"}')")"
          test "$(jq -r '.user.accountStatus' <<<"$ENABLE")" = "active"

          TEN_LOGIN2="$(login "$TENANT_USER" "$TENANT_PASS")"
          TEN_TOKEN2="$(jq -r '.token // empty' <<<"$TEN_LOGIN2")"
          test -n "$TEN_TOKEN2"

          MOVE="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$TENANT_ID" --arg r "$ROOM2_ID" '{action:"updateTenant",token:$t,item:{id:$id,roomId:$r,name:"S4 Tenant",phone:"000",moveIn:"2099-03-01"}}')")"
          test "$(jq -r '.tenant.roomId' <<<"$MOVE")" = "$ROOM2_ID"

          HOME2="$(api "$(jq -nc --arg t "$TEN_TOKEN2" '{action:"getTenantHome",token:$t}')")"
          test "$(jq -r '.room.id' <<<"$HOME2")" = "$ROOM2_ID"

          DELTEN="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$TENANT_ID" '{action:"deleteTenant",token:$t,id:$id}')")"
          test "$(jq -r '.success' <<<"$DELTEN")" = "true"

          TOKEN_AFTER_DELETE="$(api "$(jq -nc --arg t "$TEN_TOKEN2" '{action:"me",token:$t}')")"
          test "$(jq -r '.error' <<<"$TOKEN_AFTER_DELETE")" = "unauthorized"

          LOGIN_AFTER_DELETE="$(login "$TENANT_USER" "$TENANT_PASS")"
          test "$(jq -r '.error' <<<"$LOGIN_AFTER_DELETE")" = "invalid_credentials"

          DB_STATE="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT u.account_status,(SELECT COUNT(*) FROM tenant_accounts ta WHERE ta.user_id=u.id) AS bindings FROM users u WHERE u.id='$TENANT_USER_ID';" --json)"
          test "$(jq -r '.[0].results[0].account_status' <<<"$DB_STATE")" = "disabled"
          test "$(jq -r '.[0].results[0].bindings' <<<"$DB_STATE")" = "0"

          api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$PROP_ID" '{action:"deleteProperty",token:$t,id:$id}')" >/dev/null
          PROP_ID=""
          api "$(jq -nc --arg t "$OUTSIDER_TOKEN" --arg id "$OUT_PROP_ID" '{action:"deleteProperty",token:$t,id:$id}')" >/dev/null
          OUT_PROP_ID=""

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM users WHERE id='$TENANT_USER_ID';" >/dev/null
          TENANT_USER_ID=""

          echo "s4_e2e=PASS"

name: S7 Offline Readonly E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[S7-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare isolated admin fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          TS="$GITHUB_RUN_ID"
          USERNAME="s7_offline_$TS"
          PASSWORD="$(openssl rand -hex 8)"
          SALT="$(openssl rand -hex 16)"
          HASH="$(printf '%s:%s' "$PASSWORD" "$SALT" | sha256sum | awk '{print $1}')"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          USER_ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"
          PROP_ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='properties' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"
          PROP_NAME="S7 Fresh Server $TS"

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "
            INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version,account_status)
            VALUES ('$USER_ID','$USERNAME','$HASH','$SALT','S7 Offline','$NOW','admin','normal','legacy_sha256',0,2,'active');
            INSERT INTO properties (id,name,water_rate,electric_rate,address,bill_notes,qr_image,owner_id,vat_enabled,vat_rate,vat_type_rent,vat_type_water,vat_type_electric,tax_id,legal_name)
            VALUES ('$PROP_ID','$PROP_NAME',18,8,'','','','$USER_ID',0,0,'none','none','none','','');
            INSERT INTO property_admins (property_id,user_id,access_role,created_at)
            VALUES ('$PROP_ID','$USER_ID','owner','$NOW');"

          LOGIN="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg u "$USERNAME" --arg p "$PASSWORD" '{action:"login",username:$u,password:$p}')")"
          TOKEN="$(jq -r '.token // empty' <<<"$LOGIN")"
          test -n "$TOKEN"

          {
            echo "token=$TOKEN"
            echo "user_id=$USER_ID"
            echo "property_id=$PROP_ID"
            echo "property_name=$PROP_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser offline-readonly verification
        env:
          AUTH_TOKEN: ${{ steps.fixture.outputs.token }}
          PROPERTY_ID: ${{ steps.fixture.outputs.property_id }}
          PROPERTY_NAME: ${{ steps.fixture.outputs.property_name }}
        shell: bash
        run: |
          cat > s7-offline-smoke.mjs <<'NODE'
          import { chromium } from 'playwright';

          const base=process.env.PROD_URL;
          const token=process.env.AUTH_TOKEN;
          const propertyId=process.env.PROPERTY_ID;
          const serverName=process.env.PROPERTY_NAME;
          const cachedName='S7 CACHED STALE PROPERTY';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();

          let apiBlocked=true;
          let apiRequests=0;
          await page.route('**/api', async route=>{
            apiRequests++;
            if(apiBlocked) return route.abort('failed');
            return route.continue();
          });

          await page.addInitScript(({token,propertyId,cachedName})=>{
            localStorage.setItem('dorm:d1CutoverV1','1');
            localStorage.setItem('dorm:authToken',token);
            localStorage.setItem('dorm:currentUser',JSON.stringify({
              id:'offline-fixture',username:'s7-offline',displayName:'S7 Offline',isAdmin:true,platformRole:'normal',isSuperadmin:false,accountStatus:'active'
            }));
            localStorage.setItem('dorm:properties',JSON.stringify([{id:propertyId,name:cachedName,waterRate:18,electricRate:8}]));
            localStorage.setItem('dorm:rooms',JSON.stringify([]));
            localStorage.setItem('dorm:tenants',JSON.stringify([]));
            localStorage.setItem('dorm:bills',JSON.stringify([]));
            localStorage.setItem('dorm:deposits',JSON.stringify([]));
            localStorage.setItem('dorm:meterReadings',JSON.stringify([]));
            localStorage.setItem('dorm:receipts',JSON.stringify([]));
            localStorage.setItem('dorm:roomLayouts',JSON.stringify([]));
            localStorage.setItem('dorm:tenantAccounts',JSON.stringify([]));
            localStorage.setItem('dorm:currentProperty',propertyId);
          },{token,propertyId,cachedName});

          await page.goto(base,{waitUntil:'domcontentloaded'});
          await page.waitForSelector('#appRoot',{state:'visible',timeout:20000});
          await page.waitForSelector('#offlineReadOnlyBanner',{state:'visible',timeout:20000});

          const status=await page.locator('#syncStatusLine').textContent();
          if(!status?.includes('อ่านอย่างเดียว')) throw new Error('sync line not readonly: '+status);

          const selected=await page.locator('#propertySelect option:checked').textContent();
          if(!selected?.includes(cachedName)) throw new Error('cached property not shown: '+selected);

          const beforeRequests=apiRequests;
          const result=await page.evaluate(async ({propertyId})=>{
            try{
              await remoteAuthPost({action:'createRoom',item:{propertyId,number:'SHOULD-NOT-WRITE',floor:'1',rent:1,status:'vacant'}});
              return {ok:true};
            }catch(e){
              return {ok:false,error:String(e.message||e),properties:JSON.parse(localStorage.getItem('dorm:properties')||'[]')};
            }
          },{propertyId});
          if(result.ok || result.error!=='offline_read_only') throw new Error('offline mutation was not blocked: '+JSON.stringify(result));
          if(apiRequests!==beforeRequests) throw new Error('offline mutation attempted network request');
          if(result.properties[0]?.name!==cachedName) throw new Error('cached snapshot changed');

          apiBlocked=false;
          await page.locator('#offlineRetryBtn').click();
          await page.waitForFunction(()=>document.getElementById('offlineReadOnlyBanner')?.style.display==='none',{timeout:20000});
          await page.waitForFunction(name=>document.querySelector('#propertySelect option:checked')?.textContent?.includes(name),serverName,{timeout:20000});

          const onlineStatus=await page.locator('#syncStatusLine').textContent();
          if(!onlineStatus?.includes('ซิงก์กับ Cloudflare D1 แล้ว')) throw new Error('did not return online: '+onlineStatus);

          const fresh=await page.locator('#propertySelect option:checked').textContent();
          if(!fresh?.includes(serverName)) throw new Error('fresh server data not loaded: '+fresh);
          if(fresh?.includes(cachedName)) throw new Error('stale cache remained after reconnect');

          await browser.close();
          console.log('s7_offline_e2e=PASS');
          NODE
          node s7-offline-smoke.mjs

      - name: Cleanup fixture
        if: always()
        env:
          USER_ID: ${{ steps.fixture.outputs.user_id }}
          PROPERTY_ID: ${{ steps.fixture.outputs.property_id }}
        shell: bash
        run: |
          set +e
          if [ -n "$PROPERTY_ID" ]; then
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "
              DELETE FROM property_admins WHERE property_id='$PROPERTY_ID';
              DELETE FROM properties WHERE id='$PROPERTY_ID';" >/dev/null
          fi
          if [ -n "$USER_ID" ]; then
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM users WHERE id='$USER_ID';" >/dev/null
          fi

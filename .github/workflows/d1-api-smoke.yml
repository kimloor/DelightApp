name: D1 API Smoke

on:
  push:
    branches:
      - feat/d1-backend
    paths:
      - ".github/workflows/d1-api-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_URL: https://3f6f1279-delightapp.ekqtjl.workers.dev
    steps:
      - uses: actions/checkout@v6

      - name: Full preview API smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse

          base = os.environ["PREVIEW_URL"]
          user = "__d1smoke_python"
          password = "TmpSmoke2026"

          def get(path):
              with urllib.request.urlopen(base + path) as r:
                  return r.status, r.read().decode()

          def post(obj):
              data = json.dumps(obj).encode()
              req = urllib.request.Request(
                  base + "/api",
                  data=data,
                  headers={"content-type":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req) as r:
                  return r.status, json.loads(r.read().decode())

          status, html = get("/")
          assert status == 200 and html
          print("static_home=PASS")

          status, body = get("/api?action=ping")
          assert json.loads(body) == {"ok": True, "backend": "d1"}
          print("ping=PASS")

          status, body = get("/api?action=getAll")
          assert json.loads(body).get("error") == "unauthorized"
          print("getAll_unauthorized=PASS")

          status, bad = post({"action":"login","username":"__missing__","password":"wrong"})
          assert bad.get("error") == "invalid_credentials"
          print("invalid_login=PASS")

          status, reg = post({"action":"register","username":user,"password":password,"displayName":"D1Smoke"})
          assert reg.get("success") is True and reg.get("token")
          print("register=PASS")

          status, login = post({"action":"login","username":user,"password":password})
          assert login.get("success") is True and login.get("token")
          token = login["token"]
          print("login=PASS")

          status, me = post({"action":"me","token":token})
          assert me.get("success") is True
          assert me.get("user",{}).get("username") == user
          print("me=PASS")

          q = urllib.parse.urlencode({"action":"getAll","token":token})
          status, body = get("/api?" + q)
          all_data = json.loads(body)
          assert len(all_data.get("properties",[])) == 2
          assert len(all_data.get("rooms",[])) == 84
          assert len(all_data.get("tenants",[])) == 2
          assert len(all_data.get("bills",[])) == 19
          assert len(all_data.get("meterReadings",[])) == 62
          print("getAll_authenticated=PASS")
          PY

      - name: Cleanup
        if: always()
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM audit_logs WHERE username='__d1smoke_python'; DELETE FROM users WHERE username='__d1smoke_python';"

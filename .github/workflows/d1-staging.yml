name: D1 Staging Validate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/d1-backend
    paths:
      - ".github/workflows/d1-staging.yml"
      - "src/**"
      - "migrations/**"
      - "wrangler.jsonc"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare authentication
        run: npx --yes wrangler@4 whoami

      - name: Check D1 migrations
        run: npx --yes wrangler@4 d1 migrations list delightapp-db --remote

      - name: Validate D1 schema
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','properties','rooms','tenants','bills','deposits','meter_readings','receipts','room_layouts','audit_logs') ORDER BY name;"

      - name: Validate imported row counts
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT 'users' AS table_name, COUNT(*) AS row_count FROM users UNION ALL SELECT 'properties', COUNT(*) FROM properties UNION ALL SELECT 'rooms', COUNT(*) FROM rooms UNION ALL SELECT 'tenants', COUNT(*) FROM tenants UNION ALL SELECT 'bills', COUNT(*) FROM bills UNION ALL SELECT 'meter_readings', COUNT(*) FROM meter_readings UNION ALL SELECT 'deposits', COUNT(*) FROM deposits UNION ALL SELECT 'receipts', COUNT(*) FROM receipts UNION ALL SELECT 'room_layouts', COUNT(*) FROM room_layouts UNION ALL SELECT 'audit_logs', COUNT(*) FROM audit_logs;"

      - name: Validate financial baseline
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS bill_count, ROUND(SUM(rent),2) AS rent_total, ROUND(SUM(water_charge),2) AS water_total, ROUND(SUM(electric_charge),2) AS electric_total, ROUND(SUM(vat_amount),2) AS vat_total, ROUND(SUM(total),2) AS grand_total, ROUND(SUM(CASE WHEN status='paid' THEN total ELSE 0 END),2) AS paid_total, ROUND(SUM(CASE WHEN status='unpaid' THEN total ELSE 0 END),2) AS unpaid_total FROM bills;"

      - name: Validate room and bill statuses
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT 'room_' || status AS metric, COUNT(*) AS count FROM rooms GROUP BY status UNION ALL SELECT 'bill_' || status, COUNT(*) FROM bills GROUP BY status ORDER BY metric;"

      - name: Validate referential integrity
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT 'rooms_without_property' AS check_name, COUNT(*) AS problems FROM rooms r LEFT JOIN properties p ON p.id=r.property_id WHERE p.id IS NULL UNION ALL SELECT 'tenants_without_room', COUNT(*) FROM tenants t LEFT JOIN rooms r ON r.id=t.room_id WHERE r.id IS NULL UNION ALL SELECT 'bills_without_room', COUNT(*) FROM bills b LEFT JOIN rooms r ON r.id=b.room_id WHERE r.id IS NULL UNION ALL SELECT 'meters_without_room', COUNT(*) FROM meter_readings m LEFT JOIN rooms r ON r.id=m.room_id WHERE r.id IS NULL UNION ALL SELECT 'meters_without_bill', COUNT(*) FROM meter_readings m LEFT JOIN bills b ON b.id=m.bill_id WHERE m.bill_id<>'' AND b.id IS NULL;"

      - name: Upload staging Worker version
        run: npx --yes wrangler@4 versions upload --message "D1 staging validation" --tag "d1-staging"

name: Pre-Deploy Validate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "หอพัก/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare authentication
        run: npx --yes wrangler@4 whoami

      - name: Check D1 migrations
        run: npx --yes wrangler@4 d1 migrations list delightapp-db --remote

      - name: Validate D1 schema
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','properties','rooms','tenants','bills','deposits','meter_readings','receipts','room_layouts','audit_logs') ORDER BY name;"

      - name: Validate referential integrity
        run: |
          for Q in             "SELECT COUNT(*) AS rooms_without_property FROM rooms r LEFT JOIN properties p ON p.id=r.property_id WHERE p.id IS NULL;"             "SELECT COUNT(*) AS tenants_without_room FROM tenants t LEFT JOIN rooms r ON r.id=t.room_id WHERE r.id IS NULL;"             "SELECT COUNT(*) AS bills_without_room FROM bills b LEFT JOIN rooms r ON r.id=b.room_id WHERE r.id IS NULL;"             "SELECT COUNT(*) AS meters_without_room FROM meter_readings m LEFT JOIN rooms r ON r.id=m.room_id WHERE r.id IS NULL;"
          do
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "$Q"
          done

      - name: Upload preview Worker version
        run: npx --yes wrangler@4 versions upload --message "Pre-deploy validation" --tag "pre-deploy"

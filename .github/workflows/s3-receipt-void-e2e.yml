name: S3 Receipt Void Production E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[S3-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: S3 end-to-end smoke
        shell: bash
        run: |
          set -euo pipefail
          OWNER_USER="s3_owner_${GITHUB_RUN_ID}"
          ADMIN_USER="s3_admin_${GITHUB_RUN_ID}"
          OWNER_PASS="$(openssl rand -hex 16)"
          ADMIN_PASS="$(openssl rand -hex 16)"
          OWNER_SALT="$(openssl rand -hex 16)"
          ADMIN_SALT="$(openssl rand -hex 16)"
          OWNER_HASH="$(printf '%s:%s' "$OWNER_PASS" "$OWNER_SALT" | sha256sum | awk '{print $1}')"
          ADMIN_HASH="$(printf '%s:%s' "$ADMIN_PASS" "$ADMIN_SALT" | sha256sum | awk '{print $1}')"
          OWNER_ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"
          ADMIN_ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PROP_ID=""
          OWNER_TOKEN=""

          cleanup() {
            if [ -n "${OWNER_TOKEN:-}" ] && [ -n "${PROP_ID:-}" ]; then
              curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$PROP_ID" '{action:"deleteProperty",token:$t,id:$id}')" >/dev/null 2>&1 || true
            fi
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM property_admins WHERE user_id IN ('$OWNER_ID','$ADMIN_ID'); DELETE FROM users WHERE id IN ('$OWNER_ID','$ADMIN_ID');" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version) VALUES ('$OWNER_ID','$OWNER_USER','$OWNER_HASH','$OWNER_SALT','S3 Owner','$NOW','admin','normal','legacy_sha256',0,2),('$ADMIN_ID','$ADMIN_USER','$ADMIN_HASH','$ADMIN_SALT','S3 Admin','$NOW','admin','normal','legacy_sha256',0,2);"

          login() {
            curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg u "$1" --arg p "$2" '{action:"login",username:$u,password:$p}')"
          }
          api() {
            curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$1"
          }

          OWNER_LOGIN="$(login "$OWNER_USER" "$OWNER_PASS")"
          OWNER_TOKEN="$(jq -r '.token // empty' <<<"$OWNER_LOGIN")"
          test -n "$OWNER_TOKEN"

          PROP="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg n "S3 Smoke ${GITHUB_RUN_ID}" '{action:"createProperty",token:$t,item:{name:$n,waterRate:18,electricRate:8}}')")"
          PROP_ID="$(jq -r '.property.id // empty' <<<"$PROP")"
          test -n "$PROP_ID"

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "INSERT INTO property_admins (property_id,user_id,access_role,created_at) VALUES ('$PROP_ID','$ADMIN_ID','admin','$NOW');"

          ADMIN_LOGIN="$(login "$ADMIN_USER" "$ADMIN_PASS")"
          ADMIN_TOKEN="$(jq -r '.token // empty' <<<"$ADMIN_LOGIN")"
          test -n "$ADMIN_TOKEN"

          ROOM="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg p "$PROP_ID" '{action:"createRoom",token:$t,item:{propertyId:$p,number:"S3-101",floor:"1",rent:1000,status:"vacant",roomType:"smoke",deposit:500}}')")"
          ROOM_ID="$(jq -r '.room.id // empty' <<<"$ROOM")"
          test -n "$ROOM_ID"

          BILL="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg r "$ROOM_ID" '{action:"createBills",token:$t,items:[{roomId:$r,month:"2099-02",rent:1000,waterPrev:0,waterCurr:0,water:0,electricPrev:0,electricCurr:0,electric:0,total:1000,status:"unpaid",vatSubtotal:0,vatAmount:0,taxInvoiceNo:""}]}')")"
          BILL_ID="$(jq -r '.bills[0].id // empty' <<<"$BILL")"
          test -n "$BILL_ID"

          RECEIPT1="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg b "$BILL_ID" '{action:"createReceipt",token:$t,item:{billId:$b,date:"2099-02-01",note:"s3 first"}}')")"
          R1_ID="$(jq -r '.receipt.id // empty' <<<"$RECEIPT1")"
          R1_NO="$(jq -r '.receipt.receiptNo // empty' <<<"$RECEIPT1")"
          test -n "$R1_ID"
          test -n "$R1_NO"

          LOCK_UPDATE="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg b "$BILL_ID" --arg r "$ROOM_ID" '{action:"updateBill",token:$t,item:{id:$b,roomId:$r,month:"2099-02",invoiceNo:"S3-LOCK-TEST",rent:1100,waterPrev:0,waterCurr:0,water:0,electricPrev:0,electricCurr:0,electric:0,total:1100,status:"paid",vatSubtotal:0,vatAmount:0,taxInvoiceNo:""}}')")"
          test "$(jq -r '.error' <<<"$LOCK_UPDATE")" = "bill_locked_by_receipt"

          LOCK_DELETE="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg b "$BILL_ID" '{action:"deleteBill",token:$t,id:$b}')")"
          test "$(jq -r '.error' <<<"$LOCK_DELETE")" = "bill_locked_by_receipt"

          ADMIN_VOID="$(api "$(jq -nc --arg t "$ADMIN_TOKEN" --arg id "$R1_ID" '{action:"voidReceipt",token:$t,receiptId:$id,reason:"admin must not void"}')")"
          test "$(jq -r '.error' <<<"$ADMIN_VOID")" = "owner_required"

          OWNER_VOID="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$R1_ID" '{action:"voidReceipt",token:$t,receiptId:$id,reason:"correct amount"}')")"
          test "$(jq -r '.success' <<<"$OWNER_VOID")" = "true"
          test "$(jq -r '.receipt.status' <<<"$OWNER_VOID")" = "void"
          test "$(jq -r '.bill.status' <<<"$OWNER_VOID")" = "unpaid"

          AFTER_VOID_UPDATE="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg b "$BILL_ID" --arg r "$ROOM_ID" '{action:"updateBill",token:$t,item:{id:$b,roomId:$r,month:"2099-02",invoiceNo:"",rent:1100,waterPrev:0,waterCurr:0,water:0,electricPrev:0,electricCurr:0,electric:0,total:1100,status:"unpaid",vatSubtotal:0,vatAmount:0,taxInvoiceNo:""}}')")"
          test "$(jq -r '.success' <<<"$AFTER_VOID_UPDATE")" = "true"

          RECEIPT2="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg b "$BILL_ID" '{action:"createReceipt",token:$t,item:{billId:$b,date:"2099-02-02",note:"s3 replacement"}}')")"
          R2_NO="$(jq -r '.receipt.receiptNo // empty' <<<"$RECEIPT2")"
          test -n "$R2_NO"
          test "$R1_NO" != "$R2_NO"

          COUNTS="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT status,COUNT(*) AS c FROM receipts WHERE bill_id='$BILL_ID' GROUP BY status ORDER BY status;" --json)"
          test "$(jq -r '[.[0].results[] | select(.status=="active") | .c][0] // 0' <<<"$COUNTS")" = "1"
          test "$(jq -r '[.[0].results[] | select(.status=="void") | .c][0] // 0' <<<"$COUNTS")" = "1"

          DELETE_PROP="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$PROP_ID" '{action:"deleteProperty",token:$t,id:$id}')")"
          test "$(jq -r '.success' <<<"$DELETE_PROP")" = "true"
          PROP_ID=""

          echo "s3_e2e=PASS"

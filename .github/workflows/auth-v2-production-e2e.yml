name: Auth V2 Production E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[AUTH-V2-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Auth V2 end-to-end smoke
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="authv2_smoke_${GITHUB_RUN_ID}"
          PASS="$(openssl rand -hex 16)"
          NEWPASS="$(openssl rand -hex 16)"
          SALT="$(openssl rand -hex 16)"
          HASH="$(printf '%s:%s' "$PASS" "$SALT" | sha256sum | awk '{print $1}')"
          ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT CAST(COALESCE(MAX(CAST(id AS INTEGER)),0)+1 AS TEXT) AS id FROM users;" --json | jq -r '.[0].results[0].id')"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cleanup() {
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM users WHERE username='$USERNAME';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version) VALUES ('$ID','$USERNAME','$HASH','$SALT','Auth V2 Smoke','$NOW','tenant','normal','legacy_sha256',0,2);"

          LOGIN="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg u "$USERNAME" --arg p "$PASS" '{action:"login",username:$u,password:$p}')")"
          TOKEN1="$(jq -r '.token // empty' <<<"$LOGIN")"
          test -n "$TOKEN1"
          test "$(jq -r '.success' <<<"$LOGIN")" = "true"

          ALGO="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT password_algo FROM users WHERE username='$USERNAME';" --json | jq -r '.[0].results[0].password_algo')"
          test "$ALGO" = "pbkdf2_sha256"

          ME1="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg t "$TOKEN1" '{action:"me",token:$t}')")"
          test "$(jq -r '.success' <<<"$ME1")" = "true"

          CHANGE="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg t "$TOKEN1" --arg o "$PASS" --arg n "$NEWPASS" '{action:"changePassword",token:$t,oldPassword:$o,newPassword:$n}')")"
          TOKEN2="$(jq -r '.token // empty' <<<"$CHANGE")"
          test -n "$TOKEN2"

          OLD_AFTER_CHANGE="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg t "$TOKEN1" '{action:"me",token:$t}')")"
          test "$(jq -r '.error' <<<"$OLD_AFTER_CHANGE")" = "unauthorized"

          ME2="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg t "$TOKEN2" '{action:"me",token:$t}')")"
          test "$(jq -r '.success' <<<"$ME2")" = "true"

          LOGOUT_ALL="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg t "$TOKEN2" '{action:"logoutAll",token:$t}')")"
          test "$(jq -r '.success' <<<"$LOGOUT_ALL")" = "true"

          AFTER_LOGOUT_ALL="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg t "$TOKEN2" '{action:"me",token:$t}')")"
          test "$(jq -r '.error' <<<"$AFTER_LOGOUT_ALL")" = "unauthorized"

          RELOGIN="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg u "$USERNAME" --arg p "$NEWPASS" '{action:"login",username:$u,password:$p}')")"
          test "$(jq -r '.success' <<<"$RELOGIN")" = "true"

          echo "auth_v2_e2e=PASS"

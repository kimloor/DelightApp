name: Auth V2 Production Migration

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[AUTH-V2-MIGRATE]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply forward-only migrations
        run: npx --yes wrangler@4 d1 migrations apply delightapp-db --remote

      - name: Validate Auth V2 schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT password_algo,password_iterations,session_version,COUNT(*) AS users FROM users GROUP BY password_algo,password_iterations,session_version;"
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='auth_login_limits';"
          APPLIED="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT COUNT(*) AS c FROM d1_migrations WHERE name='0004_auth_session_hardening_v2.sql';" | grep -o '"c": [0-9]*' | grep -o '[0-9]*' | tail -1)"
          test "$APPLIED" = "1"
          echo "auth_v2_migration=PASS"

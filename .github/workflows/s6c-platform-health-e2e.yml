name: S6 Phase C Platform Health E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[S6C-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Phase C production verification
        shell: bash
        run: |
          set -euo pipefail
          TS="$GITHUB_RUN_ID"
          PASS="$(openssl rand -hex 8)"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          alloc(){ npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='$1' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id'; }
          uid(){ alloc users; }

          SUPER_ID="$(uid)"; NORMAL_ID="$(uid)"; TENANT_ID="$(uid)"; OWNER_ID="$(uid)"
          P1="$(alloc properties)"; P2="$(alloc properties)"
          SUPER_U="s6c_super_$TS"; NORMAL_U="s6c_normal_$TS"; TENANT_U="s6c_tenant_$TS"; OWNER_U="s6c_owner_$TS"

          mkuser(){
            local id="$1" user="$2" role="$3" platform="$4" status="$5" salt hash
            salt="$(openssl rand -hex 16)"
            hash="$(printf '%s:%s' "$PASS" "$salt" | sha256sum | awk '{print $1}')"
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version,account_status) VALUES ('$id','$user','$hash','$salt','$user','$NOW','$role','$platform','legacy_sha256',0,2,'$status');" >/dev/null
          }

          cleanup(){
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "
              DELETE FROM audit_logs WHERE user_id='$SUPER_ID';
              DELETE FROM property_admins WHERE property_id IN ('$P1','$P2') OR user_id IN ('$SUPER_ID','$NORMAL_ID','$TENANT_ID','$OWNER_ID');
              DELETE FROM properties WHERE id IN ('$P1','$P2');
              DELETE FROM users WHERE id IN ('$SUPER_ID','$NORMAL_ID','$TENANT_ID','$OWNER_ID');" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          mkuser "$SUPER_ID" "$SUPER_U" admin superadmin active
          mkuser "$NORMAL_ID" "$NORMAL_U" admin normal active
          mkuser "$TENANT_ID" "$TENANT_U" tenant normal active
          mkuser "$OWNER_ID" "$OWNER_U" admin normal disabled

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "
            INSERT INTO properties (id,name,water_rate,electric_rate,address,bill_notes,qr_image,owner_id,vat_enabled,vat_rate,vat_type_rent,vat_type_water,vat_type_electric,tax_id,legal_name)
            VALUES
            ('$P1','S6C No Owner $TS',0,0,'','','','',0,0,'none','none','none','',''),
            ('$P2','S6C Disabled Owner $TS',0,0,'','','','$OWNER_ID',0,0,'none','none','none','','');
            INSERT INTO property_admins (property_id,user_id,access_role,created_at)
            VALUES ('$P2','$OWNER_ID','owner','$NOW');"

          login(){
            curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg u "$1" --arg p "$PASS" '{action:"login",username:$u,password:$p}')"
          }
          ST="$(jq -r '.token // empty' <<<"$(login "$SUPER_U")")"
          NT="$(jq -r '.token // empty' <<<"$(login "$NORMAL_U")")"
          TT="$(jq -r '.token // empty' <<<"$(login "$TENANT_U")")"
          test -n "$ST"; test -n "$NT"; test -n "$TT"

          api(){ curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$1"; }

          NDENY="$(api "$(jq -nc --arg t "$NT" '{action:"platformHealth",token:$t}')")"
          test "$(jq -r '.error' <<<"$NDENY")" = "forbidden"
          TDENY="$(api "$(jq -nc --arg t "$TT" '{action:"platformHealth",token:$t}')")"
          test "$(jq -r '.error' <<<"$TDENY")" = "forbidden"

          # create a platform audit event owned by the temporary superadmin
          DIS="$(api "$(jq -nc --arg t "$ST" --arg id "$NORMAL_ID" '{action:"platformSetAccountStatus",token:$t,userId:$id,status:"disabled"}')")"
          test "$(jq -r '.user.accountStatus' <<<"$DIS")" = "disabled"
          RES="$(api "$(jq -nc --arg t "$ST" --arg id "$NORMAL_ID" '{action:"platformSetAccountStatus",token:$t,userId:$id,status:"active"}')")"
          test "$(jq -r '.user.accountStatus' <<<"$RES")" = "active"

          HEALTH="$(api "$(jq -nc --arg t "$ST" '{action:"platformHealth",token:$t}')")"
          test "$(jq -r '.success' <<<"$HEALTH")" = "true"
          test "$(jq -r '.schema.ok' <<<"$HEALTH")" = "true"
          test "$(jq --arg p "$P1" '[.access.propertiesWithoutOwner[]|select(.id==$p)]|length' <<<"$HEALTH")" = "1"
          test "$(jq --arg p "$P2" '[.access.propertiesWithoutActiveOwner[]|select(.id==$p)]|length' <<<"$HEALTH")" = "1"
          test "$(jq 'has("rooms") or has("tenants") or has("bills") or has("receipts") or has("deposits") or has("meterReadings")' <<<"$HEALTH")" = "false"
          test "$(grep -Eic 'key_hash|CF-Connecting-IP|x-forwarded-for|"ip"' <<<"$HEALTH")" = "0"
          test "$(jq '[.recentPlatformAudit[]|select((.action|startswith("platform"))|not)]|length' <<<"$HEALTH")" = "0"
          test "$(jq --arg u "$SUPER_U" '[.recentPlatformAudit[]|select(.username==$u)]|length' <<<"$HEALTH")" -ge 2

          echo "s6c_e2e=PASS"

name: Financial Integrity Production E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[S2-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: S2 end-to-end smoke
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="s2_smoke_${GITHUB_RUN_ID}"
          PASS="$(openssl rand -hex 16)"
          SALT="$(openssl rand -hex 16)"
          HASH="$(printf '%s:%s' "$PASS" "$SALT" | sha256sum | awk '{print $1}')"
          USER_ID="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PROP_NAME="S2 Smoke ${GITHUB_RUN_ID}"

          cleanup() {
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM property_admins WHERE user_id='$USER_ID'; DELETE FROM users WHERE id='$USER_ID';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version) VALUES ('$USER_ID','$USERNAME','$HASH','$SALT','S2 Smoke','$NOW','admin','normal','legacy_sha256',0,2);"

          LOGIN="$(curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$(jq -nc --arg u "$USERNAME" --arg p "$PASS" '{action:"login",username:$u,password:$p}')")"
          TOKEN="$(jq -r '.token // empty' <<<"$LOGIN")"
          test -n "$TOKEN"

          api() {
            curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$1"
          }

          CREATE_PROP="$(api "$(jq -nc --arg t "$TOKEN" --arg n "$PROP_NAME" '{action:"createProperty",token:$t,item:{name:$n,waterRate:18,electricRate:8}}')")"
          PROP_ID="$(jq -r '.property.id // empty' <<<"$CREATE_PROP")"
          test -n "$PROP_ID"

          cleanup() {
            if [ -n "${TOKEN:-}" ] && [ -n "${PROP_ID:-}" ]; then
              api "$(jq -nc --arg t "$TOKEN" --arg id "$PROP_ID" '{action:"deleteProperty",token:$t,id:$id}')" >/dev/null 2>&1 || true
            fi
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM property_admins WHERE user_id='$USER_ID'; DELETE FROM users WHERE id='$USER_ID';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ROOM1="$(api "$(jq -nc --arg t "$TOKEN" --arg p "$PROP_ID" '{action:"createRoom",token:$t,item:{propertyId:$p,number:"S2-101",floor:"1",rent:1000,status:"vacant",roomType:"smoke",deposit:500}}')")"
          ROOM1_ID="$(jq -r '.room.id // empty' <<<"$ROOM1")"
          test -n "$ROOM1_ID"

          ROOM2="$(api "$(jq -nc --arg t "$TOKEN" --arg p "$PROP_ID" '{action:"createRoom",token:$t,item:{propertyId:$p,number:"S2-102",floor:"1",rent:1000,status:"vacant",roomType:"smoke",deposit:500}}')")"
          ROOM2_ID="$(jq -r '.room.id // empty' <<<"$ROOM2")"
          test -n "$ROOM2_ID"
          test "$ROOM1_ID" != "$ROOM2_ID"

          DUP_ROOM="$(api "$(jq -nc --arg t "$TOKEN" --arg p "$PROP_ID" '{action:"createRoom",token:$t,item:{propertyId:$p,number:"S2-101",floor:"1",rent:1000,status:"vacant"}}')")"
          test "$(jq -r '.error' <<<"$DUP_ROOM")" = "room_number_exists"

          BILL_PAYLOAD="$(jq -nc --arg t "$TOKEN" --arg r "$ROOM1_ID" '{action:"createBills",token:$t,items:[{roomId:$r,month:"2099-01",rent:1000,waterPrev:0,waterCurr:0,water:0,electricPrev:0,electricCurr:0,electric:0,total:1000,status:"unpaid",vatSubtotal:0,vatAmount:0,taxInvoiceNo:""}]}')"
          BILL_RESP="$(api "$BILL_PAYLOAD")"
          BILL_ID="$(jq -r '.bills[0].id // empty' <<<"$BILL_RESP")"
          INVOICE_NO="$(jq -r '.bills[0].invoiceNo // empty' <<<"$BILL_RESP")"
          test -n "$BILL_ID"
          test -n "$INVOICE_NO"

          BILL_RETRY="$(api "$BILL_PAYLOAD")"
          test "$(jq '.bills | length' <<<"$BILL_RETRY")" = "0"

          RECEIPT="$(api "$(jq -nc --arg t "$TOKEN" --arg b "$BILL_ID" '{action:"createReceipt",token:$t,item:{billId:$b,date:"2099-01-01",note:"s2 smoke"}}')")"
          RECEIPT_NO="$(jq -r '.receipt.receiptNo // empty' <<<"$RECEIPT")"
          test -n "$RECEIPT_NO"

          DUP_RECEIPT="$(api "$(jq -nc --arg t "$TOKEN" --arg b "$BILL_ID" '{action:"createReceipt",token:$t,item:{billId:$b,date:"2099-01-01",note:"duplicate"}}')")"
          test "$(jq -r '.error' <<<"$DUP_RECEIPT")" = "receipt_already_exists"

          LAYOUT1="$(api "$(jq -nc --arg t "$TOKEN" --arg r "$ROOM1_ID" '{action:"upsertRoomLayout",token:$t,item:{roomId:$r,x:10,y:20}}')")"
          test "$(jq -r '.roomLayout.x' <<<"$LAYOUT1")" = "10"
          LAYOUT2="$(api "$(jq -nc --arg t "$TOKEN" --arg r "$ROOM1_ID" '{action:"upsertRoomLayout",token:$t,item:{roomId:$r,x:30,y:40}}')")"
          test "$(jq -r '.roomLayout.x' <<<"$LAYOUT2")" = "30"

          DELETE_PROP="$(api "$(jq -nc --arg t "$TOKEN" --arg id "$PROP_ID" '{action:"deleteProperty",token:$t,id:$id}')")"
          test "$(jq -r '.success' <<<"$DELETE_PROP")" = "true"
          PROP_ID=""

          echo "s2_e2e=PASS"

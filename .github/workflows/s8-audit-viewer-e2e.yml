name: Audit Viewer Production E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[S8-E2E]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_URL: https://delightapp.ekqtjl.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: S8 scoped audit end-to-end
        shell: bash
        run: |
          set -euo pipefail

          OWNER_USER="s8_owner_${GITHUB_RUN_ID}"
          ADMIN_USER="s8_admin_${GITHUB_RUN_ID}"
          SUPER_USER="s8_super_${GITHUB_RUN_ID}"
          PASS="$(openssl rand -hex 16)"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          make_legacy_user() {
            local username="$1"
            local role="$2"
            local platform="$3"
            local salt
            local hash
            local id
            salt="$(openssl rand -hex 16)"
            hash="$(printf '%s:%s' "$PASS" "$salt" | sha256sum | awk '{print $1}')"
            id="$(npx --yes wrangler@4 d1 execute delightapp-db --remote --command "UPDATE id_counters SET next_id=next_id+1 WHERE table_name='users' RETURNING next_id-1 AS id;" --json | jq -r '.[0].results[0].id')"
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "INSERT INTO users (id,username,password_hash,salt,display_name,created_at,role,platform_role,password_algo,password_iterations,session_version,account_status) VALUES ('$id','$username','$hash','$salt','$username','$NOW','$role','$platform','legacy_sha256',0,2,'active');" >/dev/null
            echo "$id"
          }

          OWNER_ID="$(make_legacy_user "$OWNER_USER" admin normal)"
          ADMIN_ID="$(make_legacy_user "$ADMIN_USER" admin normal)"
          SUPER_ID="$(make_legacy_user "$SUPER_USER" admin superadmin)"

          api() {
            curl -fsS "$PROD_URL/api" -H 'content-type: application/json' --data "$1"
          }

          login() {
            api "$(jq -nc --arg u "$1" --arg p "$PASS" '{action:"login",username:$u,password:$p}')" | jq -r '.token // empty'
          }

          OWNER_TOKEN="$(login "$OWNER_USER")"
          ADMIN_TOKEN="$(login "$ADMIN_USER")"
          SUPER_TOKEN="$(login "$SUPER_USER")"
          test -n "$OWNER_TOKEN"
          test -n "$ADMIN_TOKEN"
          test -n "$SUPER_TOKEN"

          PROP_ID=""
          cleanup() {
            if [ -n "${OWNER_TOKEN:-}" ] && [ -n "${PROP_ID:-}" ]; then
              api "$(jq -nc --arg t "$OWNER_TOKEN" --arg id "$PROP_ID" '{action:"deleteProperty",token:$t,id:$id}')" >/dev/null 2>&1 || true
            fi
            npx --yes wrangler@4 d1 execute delightapp-db --remote --command "DELETE FROM property_admins WHERE user_id IN ('$OWNER_ID','$ADMIN_ID','$SUPER_ID'); DELETE FROM users WHERE id IN ('$OWNER_ID','$ADMIN_ID','$SUPER_ID');" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          PROP="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg n "S8 Audit Smoke ${GITHUB_RUN_ID}" '{action:"createProperty",token:$t,item:{name:$n,waterRate:18,electricRate:8}}')")"
          PROP_ID="$(jq -r '.property.id // empty' <<<"$PROP")"
          test -n "$PROP_ID"

          ROOM="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg p "$PROP_ID" '{action:"createRoom",token:$t,item:{propertyId:$p,number:"S8-101",floor:"1",rent:1000,status:"vacant"}}')")"
          ROOM_ID="$(jq -r '.room.id // empty' <<<"$ROOM")"
          test -n "$ROOM_ID"

          OWNER_AUDIT="$(api "$(jq -nc --arg t "$OWNER_TOKEN" --arg p "$PROP_ID" '{action:"auditListOwner",token:$t,propertyId:$p,limit:50,offset:0}')")"
          test "$(jq -r '.success' <<<"$OWNER_AUDIT")" = "true"
          test "$(jq --arg p "$PROP_ID" '[.logs[] | select(.propertyId==$p and .action=="create" and .tableName=="rooms")] | length' <<<"$OWNER_AUDIT")" -ge 1

          OWNER_OTHER="$(api "$(jq -nc --arg t "$OWNER_TOKEN" '{action:"auditListOwner",token:$t,propertyId:"__not_owned__",limit:10,offset:0}')")"
          test "$(jq -r '.error' <<<"$OWNER_OTHER")" = "owner_required"

          ORDINARY_DENIED="$(api "$(jq -nc --arg t "$ADMIN_TOKEN" --arg p "$PROP_ID" '{action:"auditListOwner",token:$t,propertyId:$p,limit:10,offset:0}')")"
          test "$(jq -r '.error' <<<"$ORDINARY_DENIED")" = "owner_required"

          SET_ACCESS="$(api "$(jq -nc --arg t "$SUPER_TOKEN" --arg u "$ADMIN_ID" --arg p "$PROP_ID" '{action:"platformSetPropertyAccess",token:$t,userId:$u,propertyId:$p,accessRole:"admin"}')")"
          test "$(jq -r '.success' <<<"$SET_ACCESS")" = "true"

          PLATFORM_AUDIT="$(api "$(jq -nc --arg t "$SUPER_TOKEN" '{action:"auditListPlatform",token:$t,limit:100,offset:0}')")"
          test "$(jq -r '.success' <<<"$PLATFORM_AUDIT")" = "true"
          test "$(jq --arg p "$PROP_ID" '[.logs[] | select(.action=="platformSetPropertyAccess" and .propertyId==$p)] | length' <<<"$PLATFORM_AUDIT")" -ge 1
          test "$(jq --arg rid "$ROOM_ID" '[.logs[] | select(.action=="create" and .tableName=="rooms" and (.affectedIds|contains($rid)))] | length' <<<"$PLATFORM_AUDIT")" = "0"

          echo "s8_e2e=PASS"

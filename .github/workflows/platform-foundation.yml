name: Platform Foundation Migration

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[PLATFORM-FOUNDATION]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 72a2af0ff5c5e4a83d037953f8a35356
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply migrations
        run: npx --yes wrangler@4 d1 migrations apply delightapp-db --remote

      - name: Validate platform role column
        run: |
          npx --yes wrangler@4 d1 execute delightapp-db --remote --command "SELECT username,role,platform_role FROM users ORDER BY CAST(id AS INTEGER),id;"
